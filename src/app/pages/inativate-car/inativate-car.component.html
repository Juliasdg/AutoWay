<app-header></app-header>

<div class="main-section">
  <div class="content">
    <div class="form">
      <div class="title">
        <h2>Inativar Veículo?</h2>
      </div>

      <div class="content">
        <p>Deseja realmente inativar o seu veículo cuja placa é {{ veiculo?.placa }}?</p>
      </div>

      <div class="btn-area">
        <div class="btn">
          <app-btn-white label="Cancelar" (click)="onCancel()"></app-btn-white>
        </div>
        <div class="btn">
          <app-btn-purple label="Inativar" (click)="onInativar()"></app-btn-purple>
        </div>
      </div>
    </div>
  </div>
</div>

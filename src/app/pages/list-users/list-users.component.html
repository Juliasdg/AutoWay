<app-header-purple></app-header-purple>

<div class="main-section">
  <div class="title">
    <h2>Usuários do Sistema</h2>
  </div>

  <!-- Busca -->
  <div class="search-section">
    <img src="assets/search.svg" alt="Buscar">
    <input
      type="text"
      placeholder="Buscar por nome ou e-mail..."
      [(ngModel)]="searchText"
      (input)="buscarUsuario()"
    >
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    Carregando usuários...
  </div>

  <!-- Nenhum usuário -->
  <div *ngIf="!loading && filteredUsuarios.length === 0" class="no-results">
    Nenhum usuário encontrado.
  </div>

  <!-- Lista de Usuários -->
  <div *ngFor="let usuario of paginatedUsuarios" class="vehicle-card">
    <div class="vehicle-info">
      <div>
        <p><strong>Nome:</strong> {{ usuario.nome }}</p>
        <p>
          <strong>Status:</strong>
          <span class="status" [ngClass]="usuario.status ? 'active' : 'inactive'"></span>
          {{ usuario.status ? 'Ativo' : 'Inativo' }}
        </p>
        <p><strong>Telefone:</strong> {{ usuario.telefone || '-' }}</p>
        <p><strong>E-mail:</strong> {{ usuario.email }}</p>
      </div>
    </div>

    <div class="user-actions">
      <!-- Botão Ativar/Inativar -->
      <button title="Ativar/Inativar" (click)="alternarStatus(usuario)">
        <img src="assets/file-1.svg" alt="Ativar/Inativar">
      </button>

      <!-- Botão Editar -->
      <!-- Botão Editar -->
    <button title="Editar" (click)="abrirTelaEdicao(usuario.id)">
      <img src="assets/file-2.svg" alt="Editar">
    </button>
    </div>
  </div>

  <!-- Paginação -->
  <div *ngIf="!loading && totalPages > 1" class="pagination">
    <button (click)="updatePage(currentPage - 1)" [disabled]="currentPage === 1">Anterior</button>
    <span>Página {{ currentPage }} de {{ totalPages }}</span>
    <button (click)="updatePage(currentPage + 1)" [disabled]="currentPage === totalPages">Próxima</button>
  </div>
</div>
